<div
  class="image-preview"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="filename()"
>
  <button
    type="button"
    class="image-preview__backdrop"
    aria-label="Close preview"
    (click)="closed.emit()"
  ></button>

  <div class="image-preview__panel">
    <header class="image-preview__header">
      <span class="image-preview__filename">{{ filename() }}</span>
      <div class="image-preview__actions">
        <button mat-icon-button type="button" aria-label="Download image" (click)="download()">
          <mat-icon>download</mat-icon>
        </button>
        <button mat-icon-button type="button" aria-label="Close preview" (click)="closed.emit()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </header>
    <img class="image-preview__image" [src]="url()" [alt]="filename()" />
  </div>
</div>
