@if (auth.isLoggedIn()) {
  <mat-toolbar class="nav-bar">
    <span class="nav-bar__brand">Group Chat</span>
    <span class="nav-bar__spacer"></span>

    @if (auth.currentUser(); as user) {
      <span class="nav-bar__user">{{ user.username }}</span>
    }

    <a mat-button routerLink="/groups" routerLinkActive="nav-bar__link--active">Groups</a>
    <a
      mat-button
      routerLink="/invitations"
      routerLinkActive="nav-bar__link--active"
      [matBadge]="invitations.pendingCount() || null"
      matBadgeColor="accent"
      [matBadgeHidden]="invitations.pendingCount() === 0"
    >
      Invitations
    </a>
    <a mat-button routerLink="/profile" routerLinkActive="nav-bar__link--active">Profile</a>
    <button mat-button type="button" (click)="logout()">Logout</button>
  </mat-toolbar>
} @else {
  <mat-toolbar class="nav-bar nav-bar--guest">
    <span class="nav-bar__brand">Group Chat</span>
    <span class="nav-bar__spacer"></span>
    <a mat-button routerLink="/login" routerLinkActive="nav-bar__link--active">Login</a>
    <a mat-button routerLink="/register" routerLinkActive="nav-bar__link--active">Register</a>
  </mat-toolbar>
}
