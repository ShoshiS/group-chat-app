<section class="auth-card">
  <header class="auth-card__header">
    <h1>Register</h1>
    <p>Create your group chat account.</p>
  </header>

  <form class="auth-card__form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="auth-card__field">
      <span>Username</span>
      <input type="text" formControlName="username" autocomplete="username" />
      @if (showError('username')) {
        <small class="auth-card__error">Username must be at least 3 characters.</small>
      }
    </label>

    <label class="auth-card__field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (showError('email')) {
        <small class="auth-card__error">Enter a valid email.</small>
      }
    </label>

    <label class="auth-card__field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (showError('password')) {
        <small class="auth-card__error">Password must be at least 6 characters.</small>
      }
    </label>

    @if (serverError(); as message) {
      <p class="auth-card__server-error">{{ message }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Register' }}
    </button>
  </form>

  <app-google-sign-in (signInError)="onGoogleError($event)" />

  <p class="auth-card__footer">
    Already have an account?
    <a routerLink="/login">Login</a>
  </p>
</section>
