<section class="auth-card">
  <header class="auth-card__header">
    <h1>Login</h1>
    <p>Sign in to your group chat account.</p>
  </header>

  <form class="auth-card__form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="auth-card__field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (showError('email')) {
        <small class="auth-card__error">Enter a valid email.</small>
      }
    </label>

    <label class="auth-card__field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (showError('password')) {
        <small class="auth-card__error">Password must be at least 6 characters.</small>
      }
    </label>

    @if (serverError(); as message) {
      <p class="auth-card__server-error">{{ message }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="auth-card__footer">
    No account yet?
    <a routerLink="/register">Register</a>
  </p>
</section>
