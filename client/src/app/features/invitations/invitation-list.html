<section class="invitation-list">
  @if (store.loading()) {
    <div class="invitation-list__loading">
      <mat-spinner diameter="40" />
    </div>
  } @else if (store.error()) {
    <p class="invitation-list__error">{{ store.error() }}</p>
  } @else if (store.invitations().length === 0) {
    <p class="invitation-list__empty">No pending invitations.</p>
  } @else {
    @for (invitation of store.invitations(); track invitation.id) {
      <mat-card class="invitation-list__card">
        <mat-card-header>
          <mat-card-title>{{ invitation.groupName }}</mat-card-title>
          <mat-card-subtitle>Invited as {{ invitation.invitee }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-actions>
          <app-invitation-actions
            [invitation]="invitation"
            (acceptInvitation)="acceptInvitation.emit($event)"
            (rejectInvitation)="rejectInvitation.emit($event)"
          />
        </mat-card-actions>
      </mat-card>
    }
  }
</section>
