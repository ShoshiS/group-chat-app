<section class="invitations-page">
  <header class="invitations-page__header">
    <h1>Invitations</h1>
    <p>Pending group invitations appear here. Accept to join or reject to dismiss.</p>
  </header>

  <app-invitation-list
    (acceptInvitation)="onAccept($event)"
    (rejectInvitation)="onReject($event)"
  />
</section>
