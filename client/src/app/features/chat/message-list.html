<div class="message-list" #messageList>
  @if (store.loading()) {
    <div class="message-list__spinner">
      <mat-spinner diameter="40" />
    </div>
  } @else if (store.error()) {
    <p class="message-list__error">{{ store.error() }}</p>
  } @else if (!store.messages().length) {
    <p class="message-list__empty">No messages yet. Say hello!</p>
  } @else {
    @for (msg of store.messages(); track msg.id) {
      <app-message-item
        [message]="msg"
        (update)="updateMessage($event)"
        (delete)="deleteMessage($event)"
      />
    }
  }
</div>
