<div class="message-list" #messageList>
  @if (isLoading()) {
    <div class="message-list__spinner">
      <mat-spinner diameter="40" />
    </div>
  } @else if (store.error()) {
    <p class="message-list__error">{{ store.error() }}</p>
  } @else if (!timeline().length) {
    <p class="message-list__empty">No messages yet. Say hello!</p>
  } @else {
    @for (item of timeline(); track item.id) {
      @if (item.kind === 'message') {
        <app-message-item
          [message]="item.message"
          (update)="updateMessage($event)"
          (delete)="deleteMessage($event)"
        />
      } @else {
        <app-chat-system-event
          [label]="item.label"
          [status]="item.status"
          [at]="item.at"
        />
      }
    }
  }
</div>
