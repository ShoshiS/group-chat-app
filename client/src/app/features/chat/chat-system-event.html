<div
  class="chat-system-event"
  [class.chat-system-event--accepted]="status() === 'accepted'"
  [class.chat-system-event--rejected]="status() === 'rejected' || status() === 'member_removed'"
  [class.chat-system-event--pending]="status() === 'pending'"
>
  <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
  <span class="chat-system-event__label">{{ label() }}</span>
  <time class="chat-system-event__time">{{ timeLabel() }}</time>
</div>
