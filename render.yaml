# Render Blueprint — Group Chat App (monorepo)
# Docs: https://render.com/docs/blueprint-spec
#
# Setup:
# 1. Push this file to GitHub.
# 2. Render Dashboard → New → Blueprint → connect repo.
# 3. Set secret env vars marked sync: false (MongoDB, Cloudinary, Google, Gemini).
# 4. After first deploy, add production URLs to Google OAuth authorized origins.
# 5. Optional: add Deploy Hook URLs to GitHub Secrets for .github/workflows/deploy.yml

services:
  # ── Backend: Express + Socket.io ──────────────────────────────────────────
  - type: web
    name: group-chat-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: group-chat-client
          property: host
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAX_FILE_SIZE_MB
        value: 10

  # ── Frontend: Angular static site ─────────────────────────────────────────
  - type: web
    name: group-chat-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/client/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: group-chat-api
          property: host
